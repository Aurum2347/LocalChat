{% extends "base.html" %}
{% block title %}Вход - LocalChat{% endblock %}
{% block extra_css %}<link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">{% endblock %}
{% block content %}
<div class="auth-page">
    <div class="auth-container">
        <div class="auth-logo">
            <svg class="logo-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
            <h1>LocalChat</h1><p>Локальный мессенджер</p>
        </div>
        <form class="auth-form" id="login-form">
            <div class="form-group">
                <label>Username</label>
                <div class="input-with-prefix">
                    <span class="input-prefix">@</span>
                    <input type="text" id="username" required placeholder="username" maxlength="20" pattern="[a-zA-Z0-9_]+" autocomplete="off">
                </div>
            </div>
            <div class="form-group"><label>Пароль</label><input type="password" id="password" required placeholder="••••••••"></div>
            <div class="error-message" id="error-message"></div>
            <button type="submit" class="btn-primary" id="submit-btn">Войти</button>
        </form>
        <div class="auth-footer">
            <p>Нет аккаунта? <a href="{{ url_for('main.register') }}">Зарегистрироваться</a></p>
            <p class="terms-link"><a href="{{ url_for('main.terms') }}">Пользовательское соглашение</a></p>
        </div>
    </div>
</div>
<script>
document.getElementById('login-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const username = document.getElementById('username').value.trim().toLowerCase();
    const password = document.getElementById('password').value;
    const errorEl = document.getElementById('error-message');
    const btn = document.getElementById('submit-btn');
    errorEl.textContent = ''; btn.disabled = true; btn.textContent = 'Вход...';
    try {
        const res = await fetch('/api/login', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({username, password})});
        const data = await res.json();
        if (data.success) {
            sessionStorage.setItem('user', JSON.stringify({id: data.id, username: data.username, nickname: data.nickname, about_me: data.about_me, avatar: data.avatar}));
            window.location.href = '/chat';
        } else { errorEl.textContent = data.error || 'Ошибка'; btn.disabled = false; btn.textContent = 'Войти'; }
    } catch { errorEl.textContent = 'Ошибка соединения'; btn.disabled = false; btn.textContent = 'Войти'; }
});
</script>
{% endblock %}
